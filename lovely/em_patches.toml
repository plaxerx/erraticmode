# Erratic Mode - lovely patches
#
# The Mercy Rule mutation halves the Boss requirement in Lua (erratic.lua Blind:set_blind),
# but the blind-SELECT screen computes the shown requirement inline and never sees it, so the
# preview would read the full amount. Gated on the mutation flag.
#
# NB: lovely re-patches from the INSTALLED copy at game launch - a running game must be
# restarted for this to take effect.

[manifest]
version = "1.0.0"
priority = 10

# --- Mercy Rule mutation: show the halved Boss requirement on the blind-SELECT screen ---
# The in-round halving is done in Lua (erratic.lua Blind:set_blind), but the select screen
# computes the shown requirement inline here and never sees it. `type` is the blind slot
# (Small/Big/Boss) in scope of create_UIBox_blind_choice. Gated on the mutation flag.
[[patches]]
[patches.regex]
target = "functions/UI_definitions.lua"
pattern = "local blind_amt = get_blind_amount\\(G\\.GAME\\.round_resets\\.blind_ante\\)\\*blind_choice\\.config\\.mult\\*G\\.GAME\\.starting_params\\.ante_scaling"
position = "at"
payload = "local blind_amt = get_blind_amount(G.GAME.round_resets.blind_ante)*blind_choice.config.mult*G.GAME.starting_params.ante_scaling*((G.GAME.modifiers and G.GAME.modifiers.em_mut_mercy and type == 'Boss') and 0.5 or 1)"
